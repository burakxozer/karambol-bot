<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lig + Dart</title>
<style>
:root{--bg:#0b1220;--panel:#111827;--soft:#020617;--text:#e5e7eb;--accent:#22c55e;--danger:#ef4444;--line:#263246;--blue:#06b6d4}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:920px;margin:auto;padding:12px}h1{text-align:center;margin:8px 0 16px;font-size:28px}.card{background:var(--panel);padding:14px;border-radius:16px;margin-bottom:12px}.muted{opacity:.68}.hidden{display:none!important}button,input{font:inherit}button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:13px;background:var(--accent);color:#06120a;font-weight:800;font-size:16px;cursor:pointer}button:hover{filter:brightness(1.08)}button.secondary{background:#334155;color:white}.btn-row{display:flex;gap:10px}.btn-row button{flex:1}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text);font-size:17px;margin-top:7px}.match{background:var(--soft);border:1px solid var(--line);padding:12px;border-radius:13px;margin-top:8px}.match.playable{cursor:pointer;border-color:var(--accent)}.match.playable:hover{transform:translateY(-1px);background:#0d1d22}.match.done{opacity:.62}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.team{font-weight:700;overflow-wrap:anywhere}.win{color:var(--accent)}.lose{color:var(--danger);text-decoration:line-through}.round-title{display:flex;justify-content:space-between;align-items:center}.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#253247}.notice{border-left:4px solid var(--blue);padding:10px;background:#102033;border-radius:8px;margin-top:10px}.standings{display:flex;flex-direction:column;gap:4px}.standing-header,.standing-row{display:grid;grid-template-columns:30px minmax(0,1fr) 38px 38px 38px 68px 48px;align-items:center;gap:4px;padding:10px 7px}.standing-header{font-size:12px;opacity:.7}.standing-row{background:var(--soft);border-radius:10px}.standing-row:nth-child(2){border:1px solid #facc15}.standing-team{font-weight:700;overflow-wrap:anywhere}.points{color:var(--accent);font-weight:900;text-align:center;font-size:20px}.mode-switch{display:flex;gap:7px;margin:10px 0}.mode-switch button{margin:0;background:var(--soft);color:var(--text);border:1px solid var(--line)}.mode-switch button.selected{border-color:var(--accent);color:var(--accent)}.match-nav{display:flex;gap:8px;margin-bottom:10px}.match-nav button{margin:0;padding:9px;background:#334155;color:#fff;font-size:14px}.board{display:grid;border:2px solid #334155;border-radius:11px;overflow:hidden;margin-top:10px}.board-header,.board-row{display:grid}.board-row:nth-child(even){background:#020617}.board-row:nth-child(odd){background:#111c3a}.cell{min-height:43px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);font-size:21px;user-select:none}.cell:first-child{border-left:0}.dart-cell{cursor:pointer}.dart-cell:active{transform:scale(.9);background:#1e293b}.score-label{font-weight:900;background:rgba(0,0,0,.32)}.team-header{flex-direction:column;font-size:13px;text-align:center;overflow-wrap:anywhere}.team-header span{font-size:21px;font-weight:900;color:var(--accent)}.mark{width:26px;height:26px;display:flex;justify-content:center;align-items:center;border:2px solid var(--text);border-radius:50%;font-size:16px}.controls{display:flex;gap:10px}.controls button{background:#334155;color:white}.controls .undo{background:#dc2626}.modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.77);display:flex;align-items:center;justify-content:center;padding:16px}.modal-box{width:min(480px,100%);background:#0f172a;border-radius:20px;padding:24px;text-align:center;box-shadow:0 0 30px rgba(34,197,94,.25)}.cup{font-size:60px}@media(max-width:600px){h1{font-size:23px}.standing-header,.standing-row{grid-template-columns:22px minmax(0,1fr) 28px 28px 28px 53px 34px;padding:8px 4px;font-size:13px}.points{font-size:16px}.cell{min-height:37px;font-size:17px}.team-header span{font-size:17px}.btn-row{gap:7px}button{font-size:15px;padding:11px}}
.board{display:block;--board-rows:14;overflow:hidden}.cell{min-height:clamp(30px,calc((100dvh - 285px) / var(--board-rows)),54px);height:clamp(30px,calc((100dvh - 285px) / var(--board-rows)),54px)}.controls .info{flex:0 0 42px;background:var(--blue);color:#fff;font-size:18px;padding:0}.match-nav{justify-content:flex-end;flex-wrap:wrap;gap:6px}.match-nav button{width:auto;flex:none;padding:7px 10px;font-size:12px;border-radius:10px}.modal{align-items:flex-start;overflow-y:auto;padding:16px}.modal-box{max-height:calc(100dvh - 32px);overflow-y:auto}.rule-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:8px}.rule-grid input{min-width:0;margin:0;text-align:center;padding:10px;font-size:14px}.rule-grid label{font-size:12px;opacity:.75;text-align:center}.rule-row{border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:9px}.rule-row button{margin:8px 0 0;background:#475569;color:#fff;padding:8px;font-size:13px}@media(max-width:600px){.cell{min-height:clamp(28px,calc((100dvh - 260px) / var(--board-rows)),42px);height:clamp(28px,calc((100dvh - 260px) / var(--board-rows)),42px)}.modal{padding:9px}.modal-box{max-height:calc(100dvh - 18px);padding:16px}.rule-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.match-nav{justify-content:center}.match-nav button{font-size:11px;padding:6px 8px}}
.board .cell{min-height:var(--row-height,43px);height:var(--row-height,43px)}.board-header .cell{min-height:var(--header-height,58px);height:var(--header-height,58px)}.team-header{font-size:clamp(12px,2.4vw,17px);line-height:1.15;padding:5px}.team-header span{font-size:clamp(20px,3vw,28px)}.score-label{font-size:clamp(18px,3vw,25px)}.controls{margin-top:12px}.controls button{min-width:0}.controls .info{flex:0 0 52px}
</style>
</head>
<body><main class="app"><h1>🎯 LİG + DART</h1><div id="screen"></div></main><div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="modalBox" class="modal-box"></div></div>
<script>
const screen=document.querySelector('#screen'), modal=document.querySelector('#modal'), modalBox=document.querySelector('#modalBox');
const cap=s=>s.toLocaleLowerCase('tr-TR').split(/\\s+/).filter(Boolean).map(x=>x[0].toLocaleUpperCase('tr-TR')+x.slice(1)).join(' ');
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
let playerCount=0,teamCount=0,players=[],teams=[],rounds=[],stats={},results={},currentRound=0,doubleRound=false;
let winPoints=3,byePoints=1,leagueFirstTo=1,scoringMode='win',setRules=[{winnerSets:2,loserSets:1,winnerPoints:2,loserPoints:1}],byeAwarded=new Set(),activeMatch=null;
let dart={mode:'karambol',numbers:[],firstTo:1,scores:[],points:[0,0],history:[],actions:[],ended:false};

function renderPlayerCount(){screen.innerHTML=`<section class="card"><h2>Lig Kurulumu</h2><label>Oyuncu sayısı</label><input id="count" type="number" min="2" placeholder="En az 2"><button onclick="savePlayerCount()">Devam</button></section>`}
function savePlayerCount(){let v=+document.querySelector('#count').value;if(v<2)return alert('En az 2 oyuncu girin.');playerCount=v;screen.innerHTML=`<section class="card"><h2>Takım Sayısı</h2><input id="teamCount" type="number" min="2" max="${playerCount}" placeholder="Takım sayısı"><button onclick="saveTeamCount()">Devam</button></section>`}
function saveTeamCount(){let v=+document.querySelector('#teamCount').value;if(v<2||v>playerCount)return alert('Takım sayısı 2 ile oyuncu sayısı arasında olmalı.');teamCount=v;screen.innerHTML=`<section class="card"><h2>Oyuncular</h2>${Array.from({length:playerCount},(_,i)=>`<input class="player-name" placeholder="Oyuncu ${i+1}">`).join('')}<button onclick="savePlayers()">Puanlamaya Geç</button></section>`}
function savePlayers(){players=[...document.querySelectorAll('.player-name')].map(x=>cap(x.value.trim())).filter(Boolean);if(players.length!==playerCount)return alert('Lütfen tüm oyuncu adlarını girin.');renderScoring()}
function saveScoringDraft(){const w=document.querySelector('#winPoints'),b=document.querySelector('#byePoints'),ft=document.querySelector('#leagueFirstTo');if(w)winPoints=+w.value;if(b)byePoints=+b.value;if(ft)leagueFirstTo=+ft.value;const rows=[...document.querySelectorAll('.rule-row')];if(rows.length)setRules=rows.map((_,i)=>({winnerSets:+document.querySelector(`#rule-ws-${i}`).value,loserSets:+document.querySelector(`#rule-ls-${i}`).value,winnerPoints:+document.querySelector(`#rule-wp-${i}`).value,loserPoints:+document.querySelector(`#rule-lp-${i}`).value}))}
function setScoringMode(mode){saveScoringDraft();scoringMode=mode;renderScoring()}
function addSetRule(){saveScoringDraft();setRules.push({winnerSets:2,loserSets:0,winnerPoints:3,loserPoints:0});renderScoring()}
function removeSetRule(i){saveScoringDraft();setRules.splice(i,1);renderScoring()}
function renderScoring(){const bye=teamCount%2!==0;const mode=`<div class="mode-switch"><button class="${scoringMode==='win'?'selected':''}" onclick="setScoringMode('win')">Galibiyet Başı Puan</button><button class="${scoringMode==='sets'?'selected':''}" onclick="setScoringMode('sets')">Set Skoruna Göre Puan</button></div>`;const firstTo=`<label style="display:block;margin-top:12px">Maç kaç set kazanılınca biter? (First To)</label><input id="leagueFirstTo" type="number" min="1" value="${leagueFirstTo}">`;const win=`<label>Galibiyet kaç puan?</label><input id="winPoints" type="number" min="0" value="${winPoints}">${firstTo}`;const rules=`<div class="notice">Lütfen maç skoru için kuralları girin. Her kuralda önce kazananın ve kaybedenin set sayısını, ardından alacakları lig puanını yazın.</div>${setRules.map((r,i)=>`<div class="rule-row"><b>Kural ${i+1}</b><div class="rule-grid"><label>Kazanan set<input id="rule-ws-${i}" type="number" min="0" value="${r.winnerSets}"></label><label>Kaybeden set<input id="rule-ls-${i}" type="number" min="0" value="${r.loserSets}"></label><label>Kazanan puan<input id="rule-wp-${i}" type="number" min="0" value="${r.winnerPoints}"></label><label>Kaybeden puan<input id="rule-lp-${i}" type="number" min="0" value="${r.loserPoints}"></label></div>${setRules.length>1?`<button onclick="removeSetRule(${i})">Kuralı Sil</button>`:''}</div>`).join('')}<button class="secondary" onclick="addSetRule()">＋ Kural Ekle</button>${firstTo}`;screen.innerHTML=`<section class="card"><h2>Puanlama</h2><p>Takımlar kuraya çekilmeden önce puanlama modelini belirleyin.</p>${mode}${scoringMode==='win'?win:rules}${bye?`<label style="display:block;margin-top:12px">BAY geçen kaç puan?</label><input id="byePoints" type="number" min="0" value="${byePoints}">`:'<p class="notice">Takım sayısı çift olduğu için bu ligde BAY geçme yok.</p>'}<button onclick="saveScoring()">Kura Çek</button></section>`}
function saveScoring(){saveScoringDraft();if(winPoints<0||byePoints<0||leagueFirstTo<1)return alert('Puanlar 0 veya daha büyük, First To ise en az 1 olmalı.');if(scoringMode==='sets'&&(!setRules.length||setRules.some(r=>Object.values(r).some(v=>!Number.isFinite(v)||v<0))))return alert('Lütfen tüm set kuralı alanlarını 0 veya daha büyük sayı olarak girin.');buildTeams()}
function buildTeams(){const mixed=shuffle(players);teams=Array.from({length:teamCount},()=>[]);mixed.forEach((p,i)=>teams[i%teamCount].push(p));teams=teams.map(t=>t.join(' - '));renderTeamsPreview()}
function renderTeamsPreview(){screen.innerHTML=`<section class="card"><h2>Takımlar</h2>${teams.map(t=>`<div class="match">${t}</div>`).join('')}<div class="mode-switch"><button class="${!doubleRound?'selected':''}" onclick="doubleRound=false;renderTeamsPreview()">Tek Karşılaşma</button><button class="${doubleRound?'selected':''}" onclick="doubleRound=true;renderTeamsPreview()">Çift Karşılaşma</button></div><div class="btn-row"><button class="secondary" onclick="buildTeams()">Tekrar Kura</button><button onclick="startLeague()">Ligi Başlat</button></div></section>`}
function createRoundRobin(list){let a=[...list];if(a.length%2)a.push('BAY');let out=[];for(let r=0;r<a.length-1;r++){out.push(Array.from({length:a.length/2},(_,i)=>[a[i],a[a.length-1-i]]));a.splice(1,0,a.pop())}return out}
function startLeague(){stats=Object.fromEntries(teams.map(t=>[t,{o:0,g:0,m:0,p:0,sk:0,sy:0}]));results={};byeAwarded=new Set();rounds=createRoundRobin(teams);if(doubleRound)rounds=[...rounds,...rounds.map(r=>r.map(m=>m.includes('BAY')?m:[m[1],m[0]]))];currentRound=0;renderLeague()}
function awardBye(ri){if(byeAwarded.has(ri))return;rounds[ri].filter(m=>m.includes('BAY')).forEach(m=>stats[m.find(t=>t!=='BAY')].p+=byePoints);byeAwarded.add(ri)}
function matchKey(ri,mi){return `${ri}-${mi}`}
function renderNav(){return activeMatch?`<div class="match-nav"><button onclick="renderDartMatch()">🎯 Maça Dön</button><button onclick="renderLeague()">📅 Fikstür</button><button onclick="renderTable()">🏆 Puan Durumu</button></div>`:''}
function renderLeague(){let html=renderNav()+`<section class="card"><h2>Fikstür</h2><p class="muted">İstediğiniz oynanmamış maça dokunarak dart maçını başlatın. Tur sırası zorunlu değildir.</p></section>`;rounds.forEach((round,ri)=>{html+=`<section class="card"><div class="round-title"><b>${ri+1}. Tur</b></div>`;round.forEach((m,mi)=>{if(m.includes('BAY')){html+=`<div class="match"><b>${m.find(x=>x!=='BAY')}</b> <span class="muted">(BAY: +${byePoints} puan)</span></div>`;return}const res=results[matchKey(ri,mi)], clickable=true;html+=`<div class="match ${res?'done':''} playable" onclick="${res?`askReplay(${ri},${mi})`:`openDartMatch(${ri},${mi})`}"><div class="teams"><div class="team ${res?.win===m[0]?'win':res?.lose===m[0]?'lose':''}">${m[0]}</div><div>${res?res.score:'VS'}</div><div class="team ${res?.win===m[1]?'win':res?.lose===m[1]?'lose':''}">${m[1]}</div></div></div>`});html+='</section>'});html+=`<button onclick="renderTable()">Puan Durumu</button>`;screen.innerHTML=html}
function renderTable(){let rows=Object.entries(stats).sort((a,b)=>b[1].p-a[1].p||b[1].g-a[1].g||(b[1].sk-b[1].sy)-(a[1].sk-a[1].sy)||a[0].localeCompare(b[0],'tr'));screen.innerHTML=renderNav()+`<section class="card"><h2>Puan Durumu</h2><div class="standings"><div class="standing-header"><div>#</div><div>Takım</div><div>O</div><div>G</div><div>M</div><div>Set</div><div>P</div></div>${rows.map(([t,s],i)=>`<div class="standing-row"><div>${i+1}</div><div class="standing-team">${t}</div><div>${s.o}</div><div>${s.g}</div><div>${s.m}</div><div>${s.sk}-${s.sy}</div><div class="points">${s.p}</div></div>`).join('')}</div><button class="secondary" onclick="renderLeague()">Fikstüre Dön</button></section>`}

function openDartMatch(ri,mi){activeMatch={ri,mi,teams:rounds[ri][mi]};dart={mode:'karambol',numbers:[],firstTo:leagueFirstTo,scores:[],points:[0,0],history:[],actions:[],ended:false};renderDartMatch()}
function renderDartMatch(){if(!activeMatch)return renderLeague();let header=renderNav()+`<section class="card"><h2>🎯 Dart Maçı</h2>`;if(!dart.numbers.length){screen.innerHTML=header+`<p class="notice">Bu maçın sonucu tamamlanınca otomatik olarak fikstüre işlenecek.</p><p class="muted">Bu lig için belirlenen First To: <b>${dart.firstTo}</b></p><h3>Oyun Modu</h3><div class="mode-switch"><button class="${dart.mode==='karambol'?'selected':''}" onclick="dart.mode='karambol';renderDartMatch()">Karambol Kriket</button><button class="${dart.mode==='kriket'?'selected':''}" onclick="dart.mode='kriket';renderDartMatch()">Kriket (15–20)</button></div><button onclick="startDartGame()">Maçı Başlat</button><button class="secondary" onclick="cancelDartMatch()">Başlamadan Fikstüre Dön</button></section>`;return}screen.innerHTML=header+`<p class="muted">First To ${dart.firstTo}</p><div id="board" class="board"></div><div class="controls"><button class="info" onclick="showDartInfo()" title="İşlem geçmişi">i</button><button class="undo" onclick="undoDart()">⬅ Geri Al</button><button onclick="confirmDartReset()">Sıfırla</button></div></section>`;renderBoard()}
function cancelDartMatch(){activeMatch=null;renderLeague()}
function startDartGame(){dart.numbers=dart.mode==='karambol'?['20','19','18','17','16','15','14','13','12','D','T','B','H']:['20','19','18','17','16','15','B'];dart.scores=Array.from({length:2},()=>Array(dart.numbers.length).fill(0));renderDartMatch()}
function renderBoard(){const board=document.querySelector('#board'),[a,b]=activeMatch.teams;const narrow=window.innerWidth<=600,headerHeight=narrow?52:60,reserved=narrow?220:210,rowHeight=Math.max(narrow?32:42,Math.min(64,Math.floor((window.innerHeight-reserved-headerHeight)/dart.numbers.length)));board.style.gridTemplateColumns=`1fr ${narrow?46:60}px 1fr`;board.style.setProperty('--header-height',`${headerHeight}px`);board.style.setProperty('--row-height',`${rowHeight}px`);let mark=v=>v===0?'':v===1?'/':v===2?'X':'<span class="mark">X</span>';board.innerHTML=`<div class="board-header" style="grid-template-columns:inherit"><div class="cell team-header">${a}<span>${dart.points[0]}</span></div><div class="cell score-label"></div><div class="cell team-header">${b}<span>${dart.points[1]}</span></div></div>`+dart.numbers.map((n,r)=>`<div class="board-row" style="grid-template-columns:inherit"><div class="cell dart-cell" onclick="dartHit(0,${r})">${mark(dart.scores[0][r])}</div><div class="cell score-label">${n}</div><div class="cell dart-cell" onclick="dartHit(1,${r})">${mark(dart.scores[1][r])}</div></div>`).join('')}
function dartHit(t,r){if(dart.ended||dart.scores[t][r]===3)return;dart.history.push({t,r,prev:dart.scores[t][r]});dart.actions.unshift({type:'add',t,r,time:Date.now()});dart.scores[t][r]++;renderBoard();if(dart.scores[t].every(x=>x===3)){dart.points[t]++;if(dart.points[t]>=dart.firstTo){dart.ended=true;showWinner(t)}else{dart.scores=Array.from({length:2},()=>Array(dart.numbers.length).fill(0));dart.history=[];renderBoard();showMessage(`<h2>${activeMatch.teams[t]} seti kazandı</h2><p>Yeni set başladı.</p>`,true)}}}
function undoDart(){let h=dart.history.pop();if(!h||dart.ended)return;dart.scores[h.t][h.r]=h.prev;dart.actions.unshift({type:'undo',t:h.t,r:h.r,time:Date.now()});renderBoard()}
function showDartInfo(){const recent=dart.actions.slice(0,80);modalBox.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 style="margin:0">📜 İşlem Geçmişi</h2><button class="secondary" style="width:auto;margin:0;padding:7px 12px" onclick="closeModal()">✕</button></div>${recent.length?recent.map(a=>`<div style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #334155;padding:10px 0;text-align:left;color:${a.type==='add'?'#22c55e':'#ef4444'}"><span>${a.type==='add'?'＋':'−'} ${activeMatch.teams[a.t]} · ${dart.numbers[a.r]} ${a.type==='add'?'eklendi':'geri alındı'}</span><span class="muted">${new Date(a.time).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span></div>`).join(''):'<p class="muted">Henüz işlem yok.</p>'}<button class="secondary" onclick="closeModal()">Kapat</button>`;modal.classList.remove('hidden')}
function confirmDartReset(){showMessage('<h2>Maç sıfırlansın mı?</h2><div class="btn-row"><button onclick="resetDart()">Sıfırla</button><button class="secondary" onclick="closeModal()">Vazgeç</button></div>')}
function resetDart(){closeModal();dart.scores=Array.from({length:2},()=>Array(dart.numbers.length).fill(0));dart.points=[0,0];dart.history=[];renderBoard()}
function showMessage(html,auto=false){modalBox.innerHTML=html;modal.classList.remove('hidden');if(auto)setTimeout(closeModal,1300)}function closeModal(){modal.classList.add('hidden')}
function showWinner(t){const name=activeMatch.teams[t];modalBox.innerHTML=`<div class="cup">🏆</div><h2>${name}<br>maçı kazandı</h2><p>Sonuç: ${dart.points[0]} - ${dart.points[1]}</p><button onclick="recordDartWinner(${t})">Sonucu Fikstüre İşle</button>`;modal.classList.remove('hidden')}
function getLeaguePoints(winSets,loseSets){if(scoringMode==='win')return [winPoints,0];const rule=setRules.find(r=>r.winnerSets===winSets&&r.loserSets===loseSets);return rule?[rule.winnerPoints,rule.loserPoints]:null}
function recordDartWinner(winnerIndex){if(!activeMatch)return;const {ri,mi,teams:pair}=activeMatch,key=matchKey(ri,mi);if(results[key])return;const win=pair[winnerIndex],lose=pair[1-winnerIndex],winSets=dart.points[winnerIndex],loseSets=dart.points[1-winnerIndex],leaguePoints=getLeaguePoints(winSets,loseSets);if(!leaguePoints)return alert(`${winSets}-${loseSets} sonucu için puan kuralı bulunamadı. Bu maç lig sonucuna işlenemedi.`);const [winnerLeaguePoints,loserLeaguePoints]=leaguePoints;results[key]={win,lose,score:`${dart.points[0]}-${dart.points[1]}`,winnerLeaguePoints,loserLeaguePoints};stats[win].o++;stats[win].g++;stats[win].p+=winnerLeaguePoints;stats[lose].o++;stats[lose].m++;stats[lose].p+=loserLeaguePoints;stats[win].sk+=winSets;stats[win].sy+=loseSets;stats[lose].sk+=loseSets;stats[lose].sy+=winSets;if(rounds[ri].every((m,index)=>m.includes('BAY')||results[matchKey(ri,index)]))awardBye(ri);closeModal();activeMatch=null;const leagueFinished=rounds.every((round,roundIndex)=>round.every((m,matchIndex)=>m.includes('BAY')||results[matchKey(roundIndex,matchIndex)]));if(leagueFinished)return renderChampion();renderLeague()}
function askReplay(ri,mi){const m=rounds[ri][mi];modalBox.innerHTML=`<h2>Bu maç tamamlandı</h2><p><b>${m[0]}</b> – <b>${m[1]}</b></p><p>Maçı tekrar oynamak istiyor musunuz? Eski sonuç ve puanlar silinecek.</p><div class="btn-row"><button onclick="resetCompletedMatch(${ri},${mi})">Evet, tekrar oyna</button><button class="secondary" onclick="closeModal()">Hayır</button></div>`;modal.classList.remove('hidden')}
function resetCompletedMatch(ri,mi){const key=matchKey(ri,mi),res=results[key],pair=rounds[ri][mi];if(!res)return closeModal();const [leftScore,rightScore]=res.score.split('-').map(Number);const winScore=res.win===pair[0]?leftScore:rightScore,loseScore=res.lose===pair[0]?leftScore:rightScore;stats[res.win].o--;stats[res.win].g--;stats[res.win].p-=res.winnerLeaguePoints;stats[res.lose].o--;stats[res.lose].m--;stats[res.lose].p-=res.loserLeaguePoints;stats[res.win].sk-=winScore;stats[res.win].sy-=loseScore;stats[res.lose].sk-=loseScore;stats[res.lose].sy-=winScore;delete results[key];if(byeAwarded.has(ri)){rounds[ri].filter(m=>m.includes('BAY')).forEach(m=>stats[m.find(t=>t!=='BAY')].p-=byePoints);byeAwarded.delete(ri)}closeModal();renderLeague()}
function renderChampion(){const winner=Object.entries(stats).sort((a,b)=>b[1].p-a[1].p||b[1].g-a[1].g)[0][0];screen.innerHTML=`<section class="card" style="text-align:center"><div class="cup">🏆</div><h2>Şampiyon</h2><div class="points" style="font-size:28px">${winner}</div><button onclick="renderTable()">Puan Durumu</button><button class="secondary" onclick="location.reload()">Yeni Lig</button></section>`}
renderPlayerCount();
</script></body></html>
